global:
  domain: lab-keycloak.test
  namespace: web-app

networkPolicy:
  port: 53

roleBinding:
  subjects:
    kind: ServiceAccount
    name: default

keycloak:
  appName: keycloak
  replicaCount: 3
  image:
    repository: quay.io/keycloak/keycloak
    tag: latest
  port: 8080
  env: 
    - name: KC_PROXY_HEADERS
      value: "xforwarded"
    - name: KC_HOSTNAME
      value: https://lab-keycloak.test
    - name: KC_HOSTNAME_ADMIN
      value: https://lab-keycloak.test
    - name: KC_DB
      value: postgres
    - name: KC_DB_URL_HOST
      value: web-app-postgres-service
    - name: KC_DB_URL_DATABASE
      value: keycloakdb
    - name: KC_DB_USERNAME
      value: keycloak
    - name: KC_DB_PASSWORD
      value: keycloakpass
    - name: KC_BOOTSTRAP_ADMIN_USERNAME
      value: admin
    - name: KC_BOOTSTRAP_ADMIN_PASSWORD
      value: admin


