apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: view-role
rules:
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: view-rolebinding
subjects:
- kind: {{ .Values.roleBinding.subjects.kind }}
  name: {{ .Values.roleBinding.subjects.name }}
roleRef:
  kind: Role
  name: view-role
  apiGroup: rbac.authorization.k8s.io
