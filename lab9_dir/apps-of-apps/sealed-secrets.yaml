apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web-app-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitlab.com/nurkhanz1/DevOps2.git
    targetRevision: HEAD
    path: lab9_dir/sealed-secrets
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: web-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
