apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd 
spec:
  project: default
  source:
    repoURL: 'https://helm.traefik.io/traefik'
    targetRevision: '*'
    chart: traefik
  destination:
    server: 'https://kubernetes.default.svc' 
    namespace: web-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
