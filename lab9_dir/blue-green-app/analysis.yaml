apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: simulate-failure-test
  namespace: web-app
spec:
  metrics:
  - name: intentional-fail
    provider:
      job:
        spec:
          template:
            spec:
              containers:
              - name: test
                image: alpine:latest
                command: ["/bin/sh", "-c"]
                args: ["echo 'Checking metrics... CPU usage too high!'; exit 1"]
              restartPolicy: Never
          backoffLimit: 0
