apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: blue-green-demo
  namespace: web-app
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: blue-green-demo
  template:
    metadata:
      labels:
        app: blue-green-demo
    spec:
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        command: ["/bin/sh", "-c"]
        args:
          - "echo '<body style=\"background-color: green; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif;\"><h1>VERSION 1.0 - GREEN</h1></body>' > /usr/share/nginx/html/index.html && nginx -g 'daemon off;'"
        ports:
          - containerPort: 80
  strategy:
    blueGreen:
      activeService: blue-green-active
      previewService: blue-green-preview
      autoPromotionEnabled: true
      prePromotionAnalysis:
        templates:
        - templateName: simulate-failure-test
---
apiVersion: v1
kind: Service
metadata:
  name: blue-green-active
  namespace: web-app
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: blue-green-demo
---
apiVersion: v1
kind: Service
metadata:
  name: blue-green-preview
  namespace: web-app
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: blue-green-demo

