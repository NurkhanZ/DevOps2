apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web
spec:

  replicas: 3
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
      - name: init-html
        image: alpine:latest
        command: 
        - /bin/sh
        - -c
        - |
          if [ ! -f /usr/share/nginx/html/index.html ]; then
            echo "Hello from Nginx Pod ${HOSTNAME}" > /usr/share/nginx/html/index.html
          fi
        volumeMounts:
        - name: www
          mountPath: /usr/share/nginx/html
      containers:
      - name: nginx
        image: nginx:1.25.1-alpine
        ports:
        - containerPort: 80
          name: web

        readinessProbe:
          httpGet:
            path: /
            port: 80

          initialDelaySeconds: 2
          periodSeconds: 5
        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "sleep 10"]

        volumeMounts:
        - name: www
          mountPath: /usr/share/nginx/html
  volumeClaimTemplates:
  - metadata:
      name: www
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
