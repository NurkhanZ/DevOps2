apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-operator-code
  namespace: {{ .Values.global.namespace }}
data:
  sync.py: |
    from http.server import BaseHTTPRequestHandler, HTTPServer
    import json
    import urllib.request
    import urllib.parse
    import os

    class ControllerHandler(BaseHTTPRequestHandler):
        def do_POST(self):
            content_length = int(self.headers['Content-Length'])
            post_data = self.rfile.read(content_length)
            request = json.loads(post_data)

            parent = request.get("parent", {})
            spec = parent.get("spec", {})
            metadata = parent.get("metadata", {})
            
            client_id = spec.get("clientId")
            root_url = spec.get("rootUrl")
            redirect_uris = spec.get("redirectUris", [])
            secret_name = spec.get("secretName")
            namespace = metadata.get("namespace")

            # Logic to interact with Keycloak would go here.
            # For this end-term demonstration, we simulate the "functionality addition"
            # by ensuring a Secret exists with the Client configuration and a generated secret.
            
            # In a real scenario, we'd use the mounted KEYCLOAK_ADMIN_PASSWORD 
            # to get a token and call Keycloak API.
            
            children = []
            if secret_name:
                children.append({
                    "apiVersion": "v1",
                    "kind": "Secret",
                    "metadata": {
                        "name": secret_name,
                        "namespace": namespace,
                        "labels": {
                            "app.kubernetes.io/managed-by": "keycloak-client-controller"
                        }
                    },
                    "type": "Opaque",
                    "stringData": {
                        "CLIENT_ID": client_id,
                        "CLIENT_SECRET": "simulated-secret-for-" + client_id,
                        "KEYCLOAK_URL": os.environ.get("KC_URL", ""),
                        "REALM": "master"
                    }
                })

            response = {
                "status": {
                    "phase": "Ready",
                    "observedGeneration": metadata.get("generation", 1)
                },
                "children": children
            }

            self.send_response(200)
            self.send_header('Content-type', 'application/json')
            self.end_headers()
            self.wfile.write(json.dumps(response).encode('utf-8'))

    port = int(os.environ.get("PORT", 8080))
    HTTPServer(('', port), ControllerHandler).serve_forever()
