apiVersion: v1
kind: Service
metadata:
  name: keycloak-svc-stable
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: keycloak # This will be managed by Argo Rollouts
  ports:
  - port: {{ .Values.keycloak.port }}
    targetPort: {{ .Values.keycloak.port }}
    name: http
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-svc-canary
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: keycloak # This will be managed by Argo Rollouts
  ports:
  - port: {{ .Values.keycloak.port }}
    targetPort: {{ .Values.keycloak.port }}
    name: http
