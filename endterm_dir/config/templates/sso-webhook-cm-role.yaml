apiVersion: v1
kind: ConfigMap
metadata:
  name: webhook-cm-role
  namespace: {{ .Values.global.namespace }}
data:
  sync.py: |
    from http.server import BaseHTTPRequestHandler, HTTPServer
    import json

    class ControllerHandler(BaseHTTPRequestHandler):
        def do_POST(self):
            content_length = int(self.headers['Content-Length'])
            post_data = self.rfile.read(content_length)
            request = json.loads(post_data)

            obj = request.get("object", {})
            namespace_name = obj.get("metadata", {}).get("name", "")

            response = {"attachments": []}

            system_namespaces = ["kube-system", "kube-public", "kube-node-lease", "metacontroller", "default"]
            
            if namespace_name and namespace_name not in system_namespaces:
              
                view_role = {
                    "apiVersion": "rbac.authorization.k8s.io/v1",
                    "kind": "Role",
                    "metadata": {"name": "view", "namespace": namespace_name},
                    "rules": [{
                        "apiGroups": ["", "apps", "networking.k8s.io"], 
                        "resources": ["pods", "services", "deployments", "configmaps", "ingresses"], 
                        "verbs": ["get", "list", "watch"]
                    }]
                }

                edit_role = {
                    "apiVersion": "rbac.authorization.k8s.io/v1",
                    "kind": "Role",
                    "metadata": {"name": "edit", "namespace": namespace_name},
                    "rules": [{
                        "apiGroups": ["", "apps", "networking.k8s.io"], 
                        "resources": ["pods", "services", "deployments", "configmaps", "ingresses"], 
                        "verbs": ["get", "list", "watch", "create", "update", "patch", "delete"]
                    }]
                }

                admin_role = {
                    "apiVersion": "rbac.authorization.k8s.io/v1",
                    "kind": "Role",
                    "metadata": {"name": "admin", "namespace": namespace_name},
                    "rules": [{
                        "apiGroups": ["*"], 
                        "resources": ["*"], 
                        "verbs": ["*"]
                    }]
                }

                response["attachments"] = [view_role, edit_role, admin_role]

            self.send_response(200)
            self.send_header('Content-type', 'application/json')
            self.end_headers()
            self.wfile.write(json.dumps(response).encode('utf-8'))

    HTTPServer(('', 8080), ControllerHandler).serve_forever()
