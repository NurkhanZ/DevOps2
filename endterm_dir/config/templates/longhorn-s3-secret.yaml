# longhorn-s3-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: longhorn-backup-s3
  namespace: longhorn-system
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "your-aws-access-key-here"
  AWS_SECRET_ACCESS_KEY: "your-aws-secret-key-here"
  AWS_ENDPOINTS: "https://s3.us-east-1.amazonaws.com" # Required if using a specific region or MinIO
