apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sso-keycloak-hpa
  namespace: sso-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: keycloak
  minReplicas: 2
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
