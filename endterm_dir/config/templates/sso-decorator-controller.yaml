apiVersion: metacontroller.k8s.io/v1alpha1
kind: DecoratorController
metadata:
  name: namespace-role-operator
spec:
  resources:
  - apiVersion: v1
    resource: namespaces
  attachments:
  - apiVersion: rbac.authorization.k8s.io/v1
    resource: roles
  hooks:
    sync:
      webhook:
        url: http://webhook-role-service.{{ .Values.global.namespace }}.svc.cluster.local/sync
