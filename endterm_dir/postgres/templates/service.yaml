apiVersion: v1
kind: Service
metadata:
  name: postgres-service-headless
  namespace: {{ .Release.Namespace }}
  labels:
    app: postgres
spec:
  ports:
  - name: {{ .Values.postgres.appName }}
    port: {{ .Values.postgres.port }}
  clusterIP: None
  selector:
    app: postgres
