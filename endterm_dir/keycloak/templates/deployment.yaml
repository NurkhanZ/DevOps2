apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "keycloak.fullname" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.keycloak.replicaCount }}
  selector:
    matchLabels:
      {{- include "keycloak.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "keycloak.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - name: {{ include "keycloak.name" . }}
        image: {{ .Values.keycloak.image.repository }}:{{ .Values.keycloak.image.tag }}
        ports:
        - containerPort: {{ .Values.keycloak.port }}
        args:
          - "start"
          - "--http-enabled=true"
          - "--hostname-strict=false"
          - "--verbose"
        env: 
        - name: KC_PROXY_HEADERS
          value: "xforwarded"
        - name: KC_HOSTNAME
          value: "https://lab-keycloak.test"
        - name: KC_HOSTNAME_ADMIN
          value: "https://lab-keycloak.test"
        - name: KC_DB
          value: "postgres"
        - name: KC_DB_URL
          value: "jdbc:postgresql://helm-app-postgres-service:5432/keycloakdb?sslmode=disable"
        - name: KC_DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: web-app-credentials
              key: POSTGRES_USER
        - name: KC_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: web-app-credentials
              key: POSTGRES_PASSWORD
        - name: KC_BOOTSTRAP_ADMIN_USERNAME
          valueFrom:
            secretKeyRef:
              name: web-app-credentials
              key: KC_BOOTSTRAP_ADMIN_USERNAME
        - name: KC_BOOTSTRAP_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: web-app-credentials
              key: KC_BOOTSTRAP_ADMIN_PASSWORD

